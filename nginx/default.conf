# Balanceador local (round-robin) para as 2 replicas da API.
upstream api_cluster {
    # Memoria compartilhada entre os workers do nginx: sem ela cada worker alterna
    # por conta propria e, com pouco trafego, quase tudo cai na primeira replica.
    zone api_cluster 64k;

    server api1:8080;
    server api2:8080;
}

server {
    listen 80;

    # A API limita o corpo a 3 MB.
    client_max_body_size 3m;

    location / {
        proxy_pass http://api_cluster;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # IP real de quem chamou: a API usa para o rate limit por IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Localmente nao ha TLS; "https" evita o redirecionamento de HTTPS da API.
        proxy_set_header X-Forwarded-Proto https;

        # Geracao e correcao por IA podem demorar.
        proxy_read_timeout 120s;

        # Mostra qual replica respondeu (IP:porta), para provar o balanceamento.
        add_header X-Upstream $upstream_addr always;
    }
}
